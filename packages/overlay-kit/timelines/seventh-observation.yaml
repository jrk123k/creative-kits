# Overlay timeline for The Seventh Observation (1:57).
# 1080p30 only. Times are seconds on the song.

version: 1
song: audio/The_Seventh_Observation.mp3
alignment: assets/alignment/alignment.json
fps: 30
width: 1920
height: 1080
# T+ clock starts at 00:00 when the song starts
songStartSec: 0
timecodeOffsetSec: 0

colors:
  cyan: "#5CE1FF"
  red: "#FF3140"
  green: "#3DFF8A"
  white: "#F4F7FB"
  grey: "#8E98A8"
  dim: "#5A6573"
  box: "rgba(5, 10, 16, 0.72)"

fonts:
  hud: JetBrains Mono
  lyrics: Bebas Neue

accentWords:
  - humans
  - hope
  - galactic
  - alone
  - universe
  - xenobiologist

lyrics:
  pauseGapSec: 1.6
  maxLineChars: 36
  maxWords: 8
  holdSec: 0.85
  overrides:
