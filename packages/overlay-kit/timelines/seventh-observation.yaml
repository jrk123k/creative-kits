    layers:
      brackets: true
      location: true
      rec: false
      lyrics: false
      status: false
      equalizer: false
    location:
      kicker: LOC
      title: "MARS · DUNE CREST"
      subtitle: "THE COLONY BELOW"

  - id: verse
    in: 16
    out: 56
    transition: glitch
    transitionFrames: 10
    layers:
      brackets: true
      location: true
      rec: true
      lyrics: true
      status: true
      equalizer: true
    location:
      kicker: LOC
      title: "MARS · DUNE CREST"
      subtitle: "NIGHTSIDE APPROACH"
    camera: "CAM 05 · SHOULDER"
    status:
      - label: SYS
        value: NOMINAL
        tone: green
      - label: LINK
        value: "98.2%"
