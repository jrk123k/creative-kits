      end: 4.40
      text: "HELLO AGAIN, *HUMANS*."
    - start: 13.50
      end: 14.50
      text: "*HUMANS*."
    - start: 21.40
      end: 23.30
      text: "NO *HOPE* FOR THIS PLANET."
    - start: 25.20
      end: 26.20
      text: "NO *HOPE*."
    - start: 28.30
      end: 30.10
      text: "*GALACTIC* INTELLIGENCE."
    - start: 36.70
      end: 38.50
      text: "*GALACTIC* INTELLIGENCE."
    - start: 40.30
      end: 41.90
      text: "AND THAT'S WHAT YOU ASK."
    - start: 47.60
      end: 48.80
      text: "WHAT YOU ASK."
    - start: 60.90
      end: 64.70
      text: "*XENOBIOLOGIST*, THAT MEANS I GET TO JUDGE YOU."
    - start: 73.60
      end: 77.70
      text: "WHY DO *HUMANS* ALWAYS BELIEVE YOU ARE *ALONE*"
    - start: 79.90
      end: 81.40
      text: "IN THE *UNIVERSE*?"
    - start: 84.80
      end: 85.59
      text: "*ALONE*."
    - start: 85.59
      end: 91.40
      text: "*ALONE*."

scenes:
