# Chorus split: the C64 kid on the left, the grown desk on the right.
# Replace the src paths with your plates. `look: c64` pixelates and dithers
# that panel onto the Pepto palette inside the ffmpeg graph.
output:
  width: 1920
  height: 1080
  fps: 24
  duration: 8

layout: split-vertical

divider:
  px: 8
  color: "101820"

labels:
  show: true
  size: 42
  position: bottom

audio:
  from: panel
  index: 1

panels:
  - src: clips/then.mp4
    label: "1984"
    look: c64
    dither: bayer
    palette: pepto
  - src: clips/now.mp4
    label: "2026"
    look: none
