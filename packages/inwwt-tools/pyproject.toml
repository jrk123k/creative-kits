[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inwwt"
version = "1.0.0"
description = "Era-transition, C64 screen, and compositor tools for It's Not What We Thought..."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
    "pyyaml>=6",
]

[project.scripts]
inwwt = "inwwt.cli:main"

[tool.setuptools.packages.find]
include = ["inwwt*"]

[tool.setuptools.package-data]
inwwt = ["fonts/*.ttf", "fonts/*.txt"]
