[project]
name = "kit-sprite-packer"
version = "1.0.0"
description = "Pack pixel-art frames into an atlas, JSON, and previews for the 16-bit intro kit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10", "pyyaml>=6"]

[project.scripts]
kit-sprite = "spritepack.cli:main"

[tool.setuptools.packages.find]
include = ["spritepack*"]
