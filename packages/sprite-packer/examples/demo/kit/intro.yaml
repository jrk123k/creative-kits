version: 1
name: kit-demo
description: Generated by Kit Sprite Packer from an atlas JSON.
fps: 30
width: 256
height: 224
palette: 'off'
audio:
  file: audio/silence.wav
  duration: 2.0
  tail:
    duration: 0
    source: none
scenes:
- id: singer
  type: still
  start: 0.0
  end: 1.0
  cut: hard
  mouth: singer
- id: sprites
  type: stack
  start: 1.0
  end: 2.0
  cut: hard
  layers:
  - type: image
    image: art/plate_256.png
  - type: sprite
    id: cow
    frames:
    - art/cow_0.png
    - art/cow_1.png
    - art/cow_2.png
    - art/cow_3.png
    - art/cow_3.png
    - art/cow_3.png
    x: 153
    y: 164
    cycle:
      mode: loop
      hold: 4
      skip_last: 0
mouths:
  singer:
    closed: art/singer_256.png
    open: art/singer_open_256.png
    patch:
      image: art/singer_open_patch.png
      x: 116
      y: 124
vocals:
  hold_frames: 4
  lines:
  - start: 0.0
    end: 0.8
    text: HELLO
