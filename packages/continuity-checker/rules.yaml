version: 1
descriptions:
  hero_id_v1: Hero, a lean young man in his mid-twenties, clean-shaven, with dark
    brown wavy hair curling out under a grey flat tweed newsboy cap. Wide toothy grin,
    dark brows, warm brown eyes. Cream linen shirt with the sleeves rolled to the
    forearm, open collar, grey-brown suspenders, dark brown wool trousers.
  sweetheart_id_v1: Sweetheart, a slender flapper in her mid-twenties with a glossy
    black chin-length bob, blunt bangs and a sleek curl at each cheek. Pale skin,
    smoky dark eye makeup, deep red lips, a cool level gaze. Emerald-green beaded
    drop-waist sleeveless dress with gold Art Deco chevrons, emerald felt cloche with
    a gold-and-green feather brooch, long pearl ropes, emerald bracelet, gold beaded
    clutch.
  rube_id_v1: Rube, a gangly man around thirty with a long face, dark hair and a waxed
    handlebar mustache. Black bowler hat, bright royal-blue pinstripe suit, white
    shirt with an open collar and no tie, scuffed brown lace-up boots. He clutches
    an overflowing cardboard box of loose papers and moves with an awkward, stumbling,
    knock-kneed posture.
  florist_id_v1: Florist, a kindly man in his late sixties with neat swept-back silver-grey
    hair, wire-rimmed round glasses and a gentle closed smile. Pale yellow button
    shirt, maroon bow tie, long tan canvas work apron with a chest pocket holding
    a pencil.
  boss_id_v1: Boss, a heavyset, scowling man in his sixties with a deeply lined face,
    thick grey brows, a grey bristly mustache and a receding grey hairline. Translucent
    green eyeshade visor, white shirt with the sleeves rolled up, charcoal tweed vest,
    navy tie, an unlit cigar clamped in the corner of his mouth, a fountain pen in
    hand.
  nova_look_v1: grey-skinned alien woman, long straight silver hair, large black eyes,
    inverted-triangle forehead mark, silver metallic bodysuit with an inverted-triangle
    chest emblem, belt with an X-buckle
  diva_offstage_v1: Black woman, warm honey complexion, deep brown eyes, warm genuine
    smile, jet-black glossy hair in a deep side part with soft Hollywood waves to
    the shoulders, small diamond stud earrings
